spring.application.name=secure-login-logger
spring.datasource.url=jdbc:h2:mem:secureloginlogger
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# enables web console for H2 database
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#to view the table created in the h2 database, you can access the h2 console at http://localhost:8080/h2-console and use the JDBC URL jdbc:h2:mem:secureloginlogger, username sa, and password (leave it blank) to connect to the database.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
